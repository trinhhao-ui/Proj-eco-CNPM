<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Đánh giá sản phẩm - E-Commerce')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3 border-0 text-center">
                    <h4 class="fw-bold mb-1 text-primary"><i class="bi bi-star-fill text-warning me-2"></i>Đánh Giá Sản Phẩm</h4>
                    <p class="text-muted small mb-0">Chia sẻ trải nghiệm sử dụng của bạn để giúp khách hàng khác lựa chọn</p>
                </div>
                <div class="card-body p-4">
                    <!-- Khung xem trước sản phẩm đang đánh giá -->
                    <div th:if="${product != null}" class="d-flex align-items-center bg-light p-3 rounded-3 mb-4 border">
                        <img th:if="${product.imageUrl != null and !product.imageUrl.isEmpty()}"
                             th:src="${product.imageUrl}"
                             class="me-3 rounded-3 border"
                             style="width: 65px; height: 65px; object-fit: cover;">
                        <div th:unless="${product.imageUrl != null and !product.imageUrl.isEmpty()}"
                             class="me-3 rounded-3 border bg-white d-flex align-items-center justify-content-center text-muted"
                             style="width: 65px; height: 65px;">
                            <i class="bi bi-image"></i>
                        </div>
                        <div>
                            <h6 class="fw-bold mb-1 text-dark" th:text="${product.name}">Tên sản phẩm</h6>
                            <span class="text-danger fw-bold" th:text="${product.price != null ? #numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT') + ' ₫' : '0 ₫'}"></span>
                        </div>
                    </div>

                    <form th:action="@{/reviews/create}" method="post">
                        <input type="hidden" name="orderId" th:value="${orderId}">
                        <input type="hidden" name="productId" th:value="${productId}">

                        <!-- Đánh giá số sao -->
                        <div class="mb-4 text-center">
                            <label class="form-label fw-bold small text-muted d-block mb-2">Chất lượng sản phẩm:</label>
                            <div class="d-flex justify-content-center gap-3">
                                <div class="form-check form-check-inline" th:each="r : ${#numbers.sequence(5, 1, -1)}">
                                    <input class="form-check-input" type="radio" name="rating" th:id="'star' + ${r}" th:value="${r}" th:checked="${r == 5}">
                                    <label class="form-check-label text-warning fw-bold fs-5" th:for="'star' + ${r}">
                                        <span th:text="${r} + ' ★'"></span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Nhận xét chi tiết -->
                        <div class="mb-4">
                            <label for="comment" class="form-label fw-bold small text-muted">Nhận xét chi tiết:</label>
                            <textarea id="comment" name="comment" class="form-control" rows="4" required
                                      placeholder="Bạn cảm thấy chất lượng sản phẩm như thế nào? Đóng gói và thời gian giao hàng có tốt không?"></textarea>
                            <div class="form-text small">Ý kiến đóng góp chân thực của bạn là cơ sở nâng cao chất lượng dịch vụ.</div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning py-3 text-dark fw-bold fs-6 shadow-sm d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-send-fill"></i>
                                <span>Gửi Đánh Giá Của Bạn</span>
                            </button>
                            <a th:href="@{/orders/{id}(id=${orderId})}" class="btn btn-outline-secondary py-2">
                                Quay lại đơn hàng
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
