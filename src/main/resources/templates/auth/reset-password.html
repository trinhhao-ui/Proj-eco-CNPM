<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Đặt lại mật khẩu - E-Commerce')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="feature-icon-wrapper bg-danger-subtle text-danger mx-auto mb-3" style="width: 60px; height: 60px; border-radius: 50%;">
                            <i class="bi bi-shield-lock fs-2"></i>
                        </div>
                        <h3 class="fw-bold mb-1">Đặt Lại Mật Khẩu</h3>
                        <p class="text-muted small">
                            Nhập mã OTP 6 số đã gửi tới <br>
                            <strong class="text-primary" th:text="${email}">email@example.com</strong>
                        </p>
                    </div>

                    <form th:action="@{/auth/reset-password}" method="post">
                        <input type="hidden" name="email" th:value="${email}">

                        <div class="mb-3">
                            <label for="otp" class="form-label small fw-bold">Mã xác thực OTP (6 số) <span class="text-danger">*</span></label>
                            <input type="text" id="otp" name="otp" class="form-control text-center fs-3 font-monospace fw-bold"
                                   maxlength="6" required placeholder="123456" autofocus>
                        </div>

                        <div class="mb-4">
                            <label for="newPassword" class="form-label small fw-bold">Mật khẩu mới của bạn <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" id="newPassword" name="newPassword" class="form-control" required placeholder="Nhập mật khẩu mới">
                                <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="newPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-check2-circle"></i>
                            <span>Cập Nhật Mật Khẩu & Đăng Nhập</span>
                        </button>
                    </form>

                    <div class="text-center mt-4 border-top pt-4">
                        <a th:href="@{/auth/login}" class="text-decoration-none small text-muted">
                            <i class="bi bi-arrow-left me-1"></i>Hủy và quay lại Đăng nhập
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
