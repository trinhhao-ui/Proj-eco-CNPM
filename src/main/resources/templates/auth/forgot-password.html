<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Quên mật khẩu - E-Commerce')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="feature-icon-wrapper bg-warning-subtle text-warning mx-auto mb-3" style="width: 60px; height: 60px; border-radius: 50%;">
                            <i class="bi bi-key fs-2"></i>
                        </div>
                        <h3 class="fw-bold mb-1">Quên Mật Khẩu?</h3>
                        <p class="text-muted small">Nhập email tài khoản để nhận mã OTP khôi phục mật khẩu</p>
                    </div>

                    <form th:action="@{/auth/send-forgot-otp}" method="post">
                        <div class="mb-4">
                            <label for="email" class="form-label small fw-bold">Địa chỉ Email đã đăng ký <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" name="email" class="form-control" required placeholder="nhapemail@example.com">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
                            <span>Gửi Mã Xác Thực OTP</span>
                            <i class="bi bi-arrow-right"></i>
                        </button>
                    </form>

                    <div class="text-center mt-4 border-top pt-4">
                        <a th:href="@{/auth/login}" class="text-decoration-none small text-muted">
                            <i class="bi bi-arrow-left me-1"></i>Quay lại trang Đăng nhập
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
