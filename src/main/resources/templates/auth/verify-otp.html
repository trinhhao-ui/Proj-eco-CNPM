<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Xác thực OTP & Hoàn tất đăng ký')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="feature-icon-wrapper bg-warning-subtle text-warning mx-auto mb-3" style="width: 60px; height: 60px; border-radius: 50%;">
                            <i class="bi bi-shield-check fs-2"></i>
                        </div>
                        <h3 class="fw-bold mb-1">Xác Thực Mã OTP</h3>
                        <p class="text-muted small">
                            Bước 2/2: Nhập mã 6 số đã gửi tới <br>
                            <strong class="text-primary" th:text="${email}">email@example.com</strong>
                        </p>
                    </div>

                    <form th:action="@{/auth/register}" method="post">
                        <input type="hidden" name="email" th:value="${email}">

                        <div class="mb-3">
                            <label for="otp" class="form-label small fw-bold">Mã xác thực OTP (6 số) <span class="text-danger">*</span></label>
                            <input type="text" id="otp" name="otp" class="form-control text-center fs-3 font-monospace fw-bold letter-spacing-lg"
                                   maxlength="6" required placeholder="123456" autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label small fw-bold">Họ và tên của bạn <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" id="name" name="name" class="form-control" required placeholder="Ví dụ: Nguyễn Văn A">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="regPassword" class="form-label small fw-bold">Mật khẩu bảo mật <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" id="regPassword" name="password" class="form-control" required placeholder="Tối thiểu 6 ký tự">
                                <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="regPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-3 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-check-circle"></i>
                            <span>Hoàn Tất Đăng Ký Tài Khoản</span>
                        </button>
                    </form>

                    <div class="text-center mt-4 border-top pt-3">
                        <form th:action="@{/auth/send-register-otp}" method="post" class="d-inline">
                            <input type="hidden" name="email" th:value="${email}">
                            <span class="text-muted small">Chưa nhận được mã?</span>
                            <button type="submit" class="btn btn-link btn-sm fw-bold text-decoration-none p-0 ms-1">Gửi lại mã OTP</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
