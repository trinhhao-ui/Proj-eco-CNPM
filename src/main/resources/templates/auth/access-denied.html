<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Truy cập bị từ chối - 403')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="feature-icon-wrapper bg-danger-subtle text-danger mx-auto mb-3" style="width: 80px; height: 80px; border-radius: 50%;">
                    <i class="bi bi-shield-slash fs-1"></i>
                </div>

                <h4 class="fw-bold mt-2 mb-2">Từ Chối Quyền Truy Cập</h4>
                <p class="text-muted mb-4">

                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/}" class="btn btn-primary px-4 fw-bold">
                        <i class="bi bi-house me-1"></i>Về Trang Chủ
                    </a>
                    <a th:href="@{/auth/login}" class="btn btn-outline-secondary px-4">
                        Đăng Nhập Khác
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</html>
