<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<!-- Head Fragment for Manager -->
<head th:fragment="manager-head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Quản Trị Hệ Thống'">Quản Trị E-Commerce</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Manager Navbar Fragment -->
<nav th:fragment="manager-navbar" class="navbar navbar-expand-lg navbar-dark manager-navbar sticky-top shadow-sm px-3">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/manager/dashboard}">
            <i class="bi bi-shield-check text-warning fs-4"></i>
            <span>ADMIN PANEL</span>
        </a>

        <div class="d-flex align-items-center ms-auto gap-3">
            <a th:href="@{/}" target="_blank" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1">
                <i class="bi bi-eye"></i>
                <span class="d-none d-sm-inline">Xem Cửa Hàng</span>
            </a>

            <div class="text-white-50 small d-none d-md-block" th:if="${session?.SPRING_SECURITY_CONTEXT != null}">
                <i class="bi bi-person-circle text-light me-1"></i>
                <span class="text-light" th:text="${session.SPRING_SECURITY_CONTEXT.authentication.name}">Admin</span>
                <span class="badge bg-warning text-dark ms-1">Manager</span>
            </div>

            <form th:action="@{/auth/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-danger d-flex align-items-center gap-1">
                    <i class="bi bi-box-arrow-right"></i>
                    <span class="d-none d-sm-inline">Đăng xuất</span>
                </button>
            </form>
        </div>
    </div>
</nav>

<!-- Manager Sidebar Fragment -->
<div th:fragment="manager-sidebar(activePage)" class="col-md-3 col-lg-2 p-0 manager-sidebar">
    <div class="p-3">
        <div class="text-uppercase text-secondary fw-bold small mb-2 px-2" style="font-size: 0.75rem; letter-spacing: 0.05em;">Báo Cáo & Tổng Quan</div>
        <ul class="nav flex-column mb-3">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'" th:href="@{/manager/dashboard}">
                    <i class="bi bi-speedometer2"></i>
                    <span>Bảng điều khiển</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activePage == 'revenue'} ? 'active'" th:href="@{/manager/revenue}">
                    <i class="bi bi-graph-up-arrow"></i>
                    <span>Báo cáo doanh thu</span>
                </a>
            </li>
        </ul>

        <div class="text-uppercase text-secondary fw-bold small mb-2 px-2" style="font-size: 0.75rem; letter-spacing: 0.05em;">Quản Lý Bán Hàng</div>
        <ul class="nav flex-column mb-3">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activePage == 'products'} ? 'active'" th:href="@{/manager/products}">
                    <i class="bi bi-phone"></i>
                    <span>Kho điện thoại</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activePage == 'categories'} ? 'active'" th:href="@{/manager/categories}">
                    <i class="bi bi-tags"></i>
                    <span>Hãng & Danh mục</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activePage == 'orders'} ? 'active'" th:href="@{/manager/orders}">
                    <i class="bi bi-receipt"></i>
                    <span>Quản lý đơn hàng</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activePage == 'discounts'} ? 'active'" th:href="@{/manager/discounts}">
                    <i class="bi bi-ticket-perforated"></i>
                    <span>Mã giảm giá</span>
                </a>
            </li>
        </ul>

        <div class="text-uppercase text-secondary fw-bold small mb-2 px-2" style="font-size: 0.75rem; letter-spacing: 0.05em;">Khách Hàng & Phản Hồi</div>
        <ul class="nav flex-column mb-3">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activePage == 'reviews'} ? 'active'" th:href="@{/manager/reviews}">
                    <i class="bi bi-chat-square-quote"></i>
                    <span>Đánh giá của khách</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activePage == 'users'} ? 'active'" th:href="@{/manager/users}">
                    <i class="bi bi-people"></i>
                    <span>Quản lý khách hàng</span>
                </a>
            </li>
        </ul>
    </div>
</div>

<!-- Manager Footer Scripts Fragment -->
<div th:fragment="manager-scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
