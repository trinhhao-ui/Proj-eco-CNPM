<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/manager-layout :: manager-head('Quản Lý Đánh Giá')}"></head>
<body class="manager-wrapper">

<div th:replace="~{fragments/manager-layout :: manager-navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div th:replace="~{fragments/manager-layout :: manager-sidebar('reviews')}"></div>

        <!-- Main Content -->
        <main class="col-md-9 col-lg-10 manager-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1">⭐ Quản Lý Đánh Giá Sản Phẩm</h2>
                    <p class="text-muted small mb-0">Xem và kiểm duyệt các phản hồi, đánh giá từ khách hàng đã mua sản phẩm.</p>
                </div>
            </div>

            <!-- Flash alerts -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Table Card -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 70px;">ID</th>
                                    <th>Sản phẩm</th>
                                    <th>Khách hàng</th>
                                    <th style="width: 130px;">Số sao</th>
                                    <th>Nội dung nhận xét</th>
                                    <th style="width: 140px;">Ngày gửi</th>
                                    <th class="text-center" style="width: 100px;">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="r : ${reviews.content}">
                                    <td class="text-muted fw-bold" th:text="'#' + ${r.id}">#1</td>
                                    <td>
                                        <div class="fw-bold text-dark" th:text="${r.product?.name != null ? r.product.name : 'Sản phẩm đã xóa'}">Tên SP</div>
                                        <small class="text-muted" th:text="'Mã SP: #' + ${r.product?.id}"></small>
                                    </td>
                                    <td>
                                        <div class="text-dark small" th:text="${r.user?.email}">user@mail.com</div>
                                    </td>
                                    <td>
                                        <div class="text-warning">
                                            <span th:each="star : ${#numbers.sequence(1, r.rating)}">★</span>
                                            <span th:if="${r.rating < 5}" th:each="star : ${#numbers.sequence(r.rating + 1, 5)}">☆</span>
                                            <span class="text-muted small ms-1" th:text="'(' + ${r.rating} + ')'"></span>
                                        </div>
                                    </td>
                                    <!-- Fix: Use r.comment instead of r.content -->
                                    <td>
                                        <div class="text-secondary fst-italic" th:text="${r.comment}">Nội dung nhận xét</div>
                                    </td>
                                    <td class="text-muted small" th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                                    <td class="text-center">
                                        <form th:action="@{/manager/reviews/{id}/delete(id=${r.id})}" method="post" class="d-inline"
                                              onsubmit="return confirm('Bạn có chắc muốn xóa nhận xét đánh giá này?')">
                                            <button type="submit" class="btn btn-outline-danger btn-sm" title="Xóa đánh giá">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${reviews.empty}">
                                    <td colspan="7" class="text-center py-5 text-muted">
                                        <i class="bi bi-chat-left-dots fs-1 d-block mb-2 text-secondary"></i>
                                        Chưa có đánh giá nào từ khách hàng.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Phân trang -->
                <div class="card-footer bg-white py-3 border-0" th:if="${reviews.totalPages > 1}">
                    <nav>
                        <ul class="pagination pagination-sm justify-content-center mb-0">
                            <li class="page-item" th:classappend="${reviews.first} ? 'disabled'">
                                <a class="page-link" th:href="@{/manager/reviews(page=${reviews.number - 1})}">&laquo;</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, reviews.totalPages - 1)}" th:classappend="${i == reviews.number} ? 'active'">
                                <a class="page-link" th:href="@{/manager/reviews(page=${i})}" th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${reviews.last} ? 'disabled'">
                                <a class="page-link" th:href="@{/manager/reviews(page=${reviews.number + 1})}">&raquo;</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/manager-layout :: manager-scripts}"></div>
</body>
</html>
